[package]
name = "kinan-kvm-client"
description = "Cross-platform desktop client for Kinan-made KVM-over-IP switches."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kinan-kvm-client"
path = "src/main.rs"

[dependencies]
kinan-protocol = { path = "../kinan-protocol" }
kinan-h264 = { path = "../kinan-h264" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# TLS pour la requête web vers le KVM.
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
# Décodeur chargé par kinan-h264 depuis le binaire Cisco (voir ce crate).
openh264 = { version = "0.6", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.6", default-features = false, features = ["libloading"] }
directories = "5"
sys-locale = "0.3"

