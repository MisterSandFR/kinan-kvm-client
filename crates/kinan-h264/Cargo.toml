[package]
name = "kinan-h264"
description = "Runtime loader for Cisco's OpenH264 shared library (downloaded on first launch)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
openh264 = { version = "0.6", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.6", default-features = false, features = ["libloading"] }
sha2 = "0.10"
bzip2-rs = "0.1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
directories = "5"
