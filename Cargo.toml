[workspace]
resolver = "2"
members = [
    "crates/kinan-protocol",
    "crates/kinan-sim",
    "crates/kinan-kvm-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Kinan KVM Client contributors"]
repository = ""
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
